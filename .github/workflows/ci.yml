name: CI

on:
  push:
    branches: [main, prod]
  pull_request:
    branches: [main, prod]

jobs:
  ci:
    name: Type-check, lint, test, build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: evoly
          POSTGRES_PASSWORD: evoly
          POSTGRES_DB: evoly_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://evoly:evoly@localhost:5432/evoly_test
      AUTH_SECRET: ci-test-secret-not-real
      NEXT_PUBLIC_APP_URL: http://localhost:3001
      NEXT_PUBLIC_BASE_URL: http://localhost:3000
      NEXT_PUBLIC_SCANNER_URL: http://localhost:3002
      NEXT_PUBLIC_APP_HOST: localhost:3001
      NEXT_PUBLIC_BASE_DOMAIN: localhost:3001

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9.0.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Run DB migrations
        run: pnpm db:migrate:deploy

      - name: Type-check
        run: pnpm --filter "@evoly/*" exec tsc --noEmit 2>/dev/null || pnpm -r exec tsc --noEmit

      - name: Run tests
        run: pnpm test

      - name: Build apps
        run: pnpm build
        env:
          SKIP_ENV_VALIDATION: "1"
