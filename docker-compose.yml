version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: evoly
      POSTGRES_PASSWORD: evoly
      POSTGRES_DB: evoly
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U evoly"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: apps/app/Dockerfile
    restart: unless-stopped
    ports:
      - "3001:3001"
    env_file: .env
    environment:
      DATABASE_URL: "postgresql://evoly:evoly@postgres:5432/evoly"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - .:/workspace
      - /workspace/node_modules
      - /workspace/apps/app/.next

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - .:/workspace
      - /workspace/node_modules
      - /workspace/apps/web/.next

volumes:
  postgres_data:
